[project]
name = "uvusee"
version = "0.1.0"
description = "UVUsee Server - Core of the AI"
readme = "README.md"
authors = [
    { name = "Ayush Thakur", email = "ayushthakur667@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "comfy-cli>=1.28.0",
    "fastapi>=0.162.6",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
uvusee = "uvusee:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
